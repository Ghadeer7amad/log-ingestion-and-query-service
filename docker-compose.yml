services:
  postgres:
    image: postgres:15-alpine
    command: >
      postgres
      -c shared_buffers=600MB
      -c effective_cache_size=900MB
      -c maintenance_work_mem=64MB
      -c work_mem=8MB
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c synchronous_commit=on
      -c fsync=on
      -c max_connections=60
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logs_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    # 1s CFS period (the Linux kernel maximum -- 1,000,000us is the hard
    # ceiling for cpu.cfs_period_us) instead of Docker's 100ms default.
    # Same 1.0 average CPU either way; see README Section 6 for the
    # cgroup-level evidence this is based on.
    cpu_period: 1000000
    cpu_quota: 1000000
    deploy:
      resources:
        limits:
          memory: 1G

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_URL=postgres://postgres:postgres@postgres:5432/logs_db
      - RETENTION_DAYS=30
    depends_on:
      postgres:
        condition: service_healthy
    # Same reasoning as postgres above -- 1s period, same 0.5 average CPU.
    cpu_period: 1000000
    cpu_quota: 500000
    deploy:
      resources:
        limits:
          memory: 256M
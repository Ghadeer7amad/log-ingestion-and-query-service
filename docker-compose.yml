services:
  postgres:
    image: postgres:15-alpine
    command: >
      postgres
      -c shared_buffers=600MB
      -c effective_cache_size=900MB
      -c maintenance_work_mem=64MB
      -c work_mem=8MB
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c synchronous_commit=on
      -c fsync=on
      -c max_connections=60
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logs_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    # 1s CFS period (the Linux kernel maximum -- 1,000,000us is the hard
    # ceiling for cpu.cfs_period_us) instead of Docker's 100ms default.
    # Same 1.0 average CPU either way; see README Section 6 for the
    # cgroup-level evidence this is based on.
    cpu_period: 1000000
    cpu_quota: 1000000
    deploy:
      resources:
        limits:
          memory: 1G

  app:
    build: .
    # --max-old-space-size=190 (~75% of the 256MB container limit): V8's
    # default heap_size_limit resolved to ~259MB with no flag set --
    # essentially the entire container budget, leaving no headroom for
    # non-heap memory (stack, buffers, native postgres.js/libuv state). A
    # correctness/OOM-safety fix, not a performance bet, verified via
    # `require('v8').getHeapStatistics()` on the running process before
    # and after. --max-semi-space-size was also tried (bigger young
    # generation, theory: fewer minor GCs) and dropped: measured via
    # --prof under the same load, it made GC *worse* (26.8% of ticks vs
    # 22.5% without it) -- likely each scavenge got more expensive to scan
    # faster than it got rarer for this workload's allocation pattern.
    # Not shipped on the strength of a plausible theory that measured
    # backwards.
    command: ["node", "--max-old-space-size=190", "dist/index.js"]
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_URL=postgres://postgres:postgres@postgres:5432/logs_db
      - RETENTION_DAYS=30
      # Crash-safety proven across multiple sustained-load runs targeting
      # the exact failure mode that crashed the earlier postgres.js-based
      # COPY attempt (forced query cancellation and connection termination
      # mid-COPY) -- two real unhandled-error paths were found and fixed
      # during that testing (db/index.ts's copyPool.on('error', ...) and
      # copyInsert.ts's client-level error race), not zero. Performance
      # measured at parity connection-pool size against UNNEST: modest,
      # consistent improvement on aggregate success, logs/sec, and ingest
      # success, no regression found. See README for the full numbers.
      - USE_COPY_INGEST=true
    depends_on:
      postgres:
        condition: service_healthy
    # Same reasoning as postgres above -- 1s period, same 0.5 average CPU.
    cpu_period: 1000000
    cpu_quota: 500000
    deploy:
      resources:
        limits:
          memory: 256M